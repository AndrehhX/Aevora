[package]
name = "aevora"
version = "0.1.0"
description = "Aevora desktop launcher"
authors = ["Andreh Callejas"]
edition = "2021"

[lib]
name = "aevora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
